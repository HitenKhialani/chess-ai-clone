<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="420" viewBox="0 0 640 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8BE78B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <linearGradient id="darkSq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="lightSq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>
    <filter id="boardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.25" />
    </filter>
    <clipPath id="rounded">
      <rect x="0" y="0" width="400" height="400" rx="14"/>
    </clipPath>
  </defs>

  <!-- rounded glass card background -->
  <rect x="60" y="20" width="520" height="380" rx="20" fill="url(#bg)" />
  <rect x="60" y="20" width="520" height="380" rx="20" stroke="rgba(255,255,255,0.35)" fill="none"/>

  <!-- chessboard group -->
  <g transform="translate(120, 50)" filter="url(#boardShadow)">
    <g clip-path="url(#rounded)">
      <rect width="400" height="400" fill="#0E1B12" opacity="0.7"/>
      <!-- 8x8 squares, size 50 -->
      <g transform="translate(0,0)">
        <!-- row 0 -->
        <rect x="0" y="0" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="50" y="0" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="100" y="0" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="150" y="0" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="200" y="0" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="250" y="0" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="300" y="0" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="350" y="0" width="50" height="50" fill="url(#darkSq)"/>
        <!-- row 1 -->
        <rect x="0" y="50" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="50" y="50" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="100" y="50" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="150" y="50" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="200" y="50" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="250" y="50" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="300" y="50" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="350" y="50" width="50" height="50" fill="url(#lightSq)"/>
        <!-- row 2 -->
        <rect x="0" y="100" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="50" y="100" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="100" y="100" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="150" y="100" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="200" y="100" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="250" y="100" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="300" y="100" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="350" y="100" width="50" height="50" fill="url(#darkSq)"/>
        <!-- row 3 -->
        <rect x="0" y="150" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="50" y="150" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="100" y="150" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="150" y="150" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="200" y="150" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="250" y="150" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="300" y="150" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="350" y="150" width="50" height="50" fill="url(#lightSq)"/>
        <!-- row 4 -->
        <rect x="0" y="200" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="50" y="200" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="100" y="200" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="150" y="200" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="200" y="200" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="250" y="200" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="300" y="200" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="350" y="200" width="50" height="50" fill="url(#darkSq)"/>
        <!-- row 5 -->
        <rect x="0" y="250" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="50" y="250" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="100" y="250" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="150" y="250" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="200" y="250" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="250" y="250" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="300" y="250" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="350" y="250" width="50" height="50" fill="url(#lightSq)"/>
        <!-- row 6 -->
        <rect x="0" y="300" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="50" y="300" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="100" y="300" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="150" y="300" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="200" y="300" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="250" y="300" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="300" y="300" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="350" y="300" width="50" height="50" fill="url(#darkSq)"/>
        <!-- row 7 -->
        <rect x="0" y="350" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="50" y="350" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="100" y="350" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="150" y="350" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="200" y="350" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="250" y="350" width="50" height="50" fill="url(#lightSq)"/>
        <rect x="300" y="350" width="50" height="50" fill="url(#darkSq)"/>
        <rect x="350" y="350" width="50" height="50" fill="url(#lightSq)"/>
      </g>
    </g>
  </g>

  <!-- soft glow -->
  <ellipse cx="320" cy="210" rx="260" ry="120" fill="#81C784" opacity="0.35" filter="url(#soft)"/>
</svg>
